apiVersion: v1
kind: Secret
metadata:
  name: mcp-atlassian-secrets
stringData:
  confluenceBaseUrl: "https://your-domain.atlassian.net"
  confluenceEmail: "your.email@example.com"
  confluenceApiToken: "your_confluence_api_token"
  jiraBaseUrl: "https://your-domain.atlassian.net"
  jiraEmail: "your.email@example.com"
  jiraApiToken: "your_jira_api_token"
